# Application Name
spring.application.name=travel-planer
server.port=8081

# ===================================
# H2 DATABASE CONFIGURATION (Development)
# ===================================
# H2 is an in-memory database - perfect for development and testing
# Data is lost when the app stops (we'll use MySQL for production later)

spring.datasource.url=jdbc:h2:file:./data/traveldb;AUTO_SERVER=TRUE
# jdbc:h2:file: = file-based H2 (data persists across restarts)
# ./data/traveldb = stored in project /data/traveldb.mv.db

spring.datasource.driver-class-name=org.h2.Driver
# Tells Spring which driver to use for database connection

spring.datasource.username=sa
# Default H2 username (System Administrator)

spring.datasource.password=
# Empty password for development (NEVER do this in production!)

# ===================================
# H2 CONSOLE CONFIGURATION
# ===================================
# Enables web interface to view database tables and run SQL queries
# Access at: http://localhost:8080/h2-console

spring.h2.console.enabled=true
# Enables the H2 web console

spring.h2.console.path=/h2-console
# URL path for the console

# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================
# JPA = Java Persistence API (standard interface)
# Hibernate = Implementation of JPA (does the actual work)

spring.jpa.hibernate.ddl-auto=update
# update = keep existing data, only add new columns/tables

spring.jpa.show-sql=true
# Prints all SQL queries to console - great for learning!
# You'll see INSERT, SELECT, UPDATE, DELETE statements

spring.jpa.properties.hibernate.format_sql=true
# Makes SQL queries readable with proper indentation

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Tells Hibernate which SQL dialect to use (H2 has some unique syntax)

# ===================================
# JWT CONFIGURATION
# ===================================
# JWT = JSON Web Token (for authentication)

jwt.secret=your-super-secret-key-change-this-in-production-minimum-256-bits
# Secret key used to sign JWT tokens (HMAC algorithm)
# IMPORTANT: In production, use a long random string (256+ bits)
# Anyone with this key can create valid tokens!

jwt.expiration=86400000
# Token expiration time in milliseconds
# 86400000 ms = 24 hours (1000ms * 60s * 60m * 24h)
# After this time, user must login again

# Application runs on http://localhost:8081

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.org.springframework.security=DEBUG
# Shows detailed Spring Security logs - helpful for debugging auth issues
# Change to INFO in production

logging.level.org.hibernate.SQL=DEBUG
# Shows SQL statements with parameter values

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Shows parameter values in SQL queries


# ===================================
# Swagger / OpenAPI Configuration
# ===================================
# Swagger UI path (default: /swagger-ui.html, also available at /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html

# API docs JSON path (default: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Show detailed validation errors in responses
springdoc.show-actuator=false

# Group all endpoints under /api/**
springdoc.packages-to-scan=zoll_h1.com.travel_planer.controller

# API Information
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha