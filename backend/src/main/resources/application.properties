# Application Name
spring.application.name=travel-planer
server.port=8081

# ===================================
# MYSQL DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:travel_planner}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:travel_user}
spring.datasource.password=${MYSQL_PASSWORD:travel_password}

# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT CONFIGURATION
# ===================================
jwt.secret=your-super-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================
# Swagger / OpenAPI Configuration
# ===================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false
springdoc.packages-to-scan=zoll_h1.com.travel_planer.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
