services:
  mysql:
    image: mysql:8.4
    container_name: travel-planner-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travel_planner
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
